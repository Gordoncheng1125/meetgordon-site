<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemma 4 — One Ripple Golden Set</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 16px 24px; background: #242424; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ecdc4; }
  .header h1 { font-size: 16px; font-weight: 500; color: #999; }
  .header h1 strong { color: #e0e0e0; font-weight: 600; }
  .header .model { margin-left: auto; font-size: 12px; color: #666; background: #2a2a2a; padding: 4px 10px; border-radius: 4px; }
  .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .msg { max-width: 85%; line-height: 1.7; font-size: 15px; }
  .msg.user { align-self: flex-end; background: #2d4a5e; padding: 12px 18px; border-radius: 16px 16px 4px 16px; }
  .msg.assistant { align-self: flex-start; background: #2a2a2a; padding: 16px 20px; border-radius: 16px 16px 16px 4px; border: 1px solid #333; }
  .msg.assistant pre { background: #1a1a1a; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .msg.assistant code { font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
  .msg .meta { font-size: 11px; color: #666; margin-top: 8px; }
  .input-area { padding: 16px 24px; background: #242424; border-top: 1px solid #333; }
  .input-row { display: flex; gap: 10px; }
  textarea { flex: 1; background: #1a1a1a; border: 1px solid #444; border-radius: 10px; padding: 12px 16px; color: #e0e0e0; font-size: 15px; font-family: inherit; resize: none; height: 52px; outline: none; }
  textarea:focus { border-color: #4ecdc4; }
  textarea::placeholder { color: #555; }
  button { background: #4ecdc4; color: #1a1a1a; border: none; border-radius: 10px; padding: 0 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #45b8b0; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  .typing { color: #4ecdc4; font-size: 13px; padding: 4px 0; }
  .status { text-align: center; padding: 8px; font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <h1><strong>One Ripple</strong> — Golden Set Testing</h1>
  <div class="model">gemma4:26b</div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="Enter a prompt to test Gemma 4..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const OLLAMA_URL = 'https://gordons-mac-mini.tail83234a.ts.net';
const MODEL = 'gemma4:26b';
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let history = [];

function addMsg(role, content, meta) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = content.replace(/\n/g, '<br>');
  if (meta) div.innerHTML += `<div class="meta">${meta}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const assistantDiv = addMsg('assistant', '<span class="typing">Thinking...</span>');
  const startTime = Date.now();

  try {
    const res = await fetch(`${OLLAMA_URL}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: history, stream: true })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n').filter(l => l.trim())) {
        try {
          const json = JSON.parse(line);
          if (json.message?.content) {
            fullText += json.message.content;
            assistantDiv.innerHTML = fullText.replace(/\n/g, '<br>');
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch(e) {}
      }
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    assistantDiv.innerHTML = fullText.replace(/\n/g, '<br>') + `<div class="meta">${MODEL} · ${elapsed}s</div>`;
    history.push({ role: 'assistant', content: fullText });
  } catch(e) {
    assistantDiv.innerHTML = `<span style="color:#e87e6e">Connection failed: ${e.message}<br>Make sure Ollama is running on Mac mini</span>`;
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

// Check connection
fetch(`${OLLAMA_URL}/api/tags`).then(r => r.json()).then(d => {
  const models = d.models.map(m => m.name).join(', ');
  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = `Connected to Mac mini · Available models: ${models}`;
  chatEl.appendChild(status);
}).catch(() => {
  const status = document.createElement('div');
  status.className = 'status';
  status.style.color = '#e87e6e';
  status.textContent = 'Cannot connect to Mac mini Ollama (100.65.248.90:11434)';
  chatEl.appendChild(status);
});
</script>

</body>
</html>
