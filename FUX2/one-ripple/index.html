<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>One Ripple</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; cursor: none; }
  body.moving { cursor: default; }

  .slide-frame {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    border: none; display: none; background: #000;
  }
  .slide-frame.active { display: block; }

  /* Click overlay — captures mouse events above iframes */
  .click-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 50; cursor: default;
    pointer-events: none;
  }
  .click-zone {
    position: absolute; pointer-events: auto; cursor: pointer;
  }
  .click-zone.left { top: 0; left: 0; width: 80px; height: 100%; }
  .click-zone.right { top: 0; right: 0; width: 80px; height: 100%; }
  .click-zone.bottom { bottom: 0; left: 0; right: 0; height: 60px; }
  .click-zone.top-right { top: 0; right: 0; width: 80px; height: 60px; }

  /* Navigation dots */
  .nav-dots {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100; transition: opacity 0.4s;
  }
  .nav-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.15); cursor: pointer;
    transition: all 0.3s;
  }
  .nav-dot.active { background: rgba(196,166,122,0.8); transform: scale(1.3); }
  .nav-dot:hover { background: rgba(196,166,122,0.5); }

  /* Arrow buttons */
  .nav-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.05); color: rgba(196,166,122,0.5);
    font-size: 20px; cursor: pointer; z-index: 100;
    transition: opacity 0.4s, background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-arrow:hover { background: rgba(255,255,255,0.1); color: rgba(196,166,122,0.8); }
  .nav-arrow.left { left: 20px; }
  .nav-arrow.right { right: 20px; }

  /* Page counter */
  .page-counter {
    position: fixed; bottom: 28px; right: 32px;
    font-family: 'Helvetica Neue', sans-serif; font-size: 11px;
    color: rgba(255,255,255,0.2); z-index: 100;
  }

  /* Music button */
  .music-btn {
    position: fixed; top: 24px; right: 28px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(196,166,122,0.2); background: transparent;
    color: rgba(196,166,122,0.5); font-size: 14px;
    cursor: pointer; z-index: 100;
    transition: box-shadow 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .music-btn.playing { box-shadow: 0 0 12px rgba(196,166,122,0.3); color: rgba(196,166,122,0.8); }
</style>
</head>
<body>

<!-- Slides as iframes -->
<iframe class="slide-frame active" src="slide-01-cover.html" id="s0"></iframe>
<iframe class="slide-frame" src="slide-02-problem.html" id="s1"></iframe>
<iframe class="slide-frame" src="slide-03-insights.html" id="s2"></iframe>
<iframe class="slide-frame" src="slide-04-metaphor.html" id="s3"></iframe>
<iframe class="slide-frame" src="slide-05-hmw.html" id="s4"></iframe>
<iframe class="slide-frame" src="slide-06-hypo1.html" id="s5"></iframe>
<iframe class="slide-frame" src="slide-06b-demo1.html" id="s6"></iframe>
<iframe class="slide-frame" src="slide-07-hypo2.html" id="s7"></iframe>
<iframe class="slide-frame" src="slide-07b-demo2.html" id="s8"></iframe>
<iframe class="slide-frame" src="slide-08-hypo3.html" id="s9"></iframe>
<iframe class="slide-frame" src="slide-08b-demo3.html" id="s10"></iframe>
<iframe class="slide-frame" src="slide-vo2max-C.html" id="s12"></iframe>
<iframe class="slide-frame" src="slide-09-closing.html" id="s13"></iframe>

<!-- Click overlay for mouse events above iframes -->
<div class="click-overlay">
  <div class="click-zone left" id="clickLeft"></div>
  <div class="click-zone right" id="clickRight"></div>
  <div class="click-zone bottom"></div>
  <div class="click-zone top-right"></div>
</div>

<!-- Navigation -->
<div class="nav-dots" id="dots"></div>
<button class="nav-arrow left" id="prevBtn">&#8249;</button>
<button class="nav-arrow right" id="nextBtn">&#8250;</button>
<div class="page-counter" id="counter"></div>

<!-- Music -->
<button class="music-btn" id="musicBtn">&#9835;</button>
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/wav">
</audio>

<script>
const frames = document.querySelectorAll('.slide-frame');
const total = frames.length;
let cur = 0;

// Build dots
const dotsEl = document.getElementById('dots');
for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'nav-dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

function goTo(idx) {
  if (idx < 0 || idx >= total || idx === cur) return;
  frames[cur].classList.remove('active');
  dotsEl.children[cur].classList.remove('active');
  cur = idx;
  frames[cur].classList.add('active');
  dotsEl.children[cur].classList.add('active');
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + total;

  // Auto-play music on metaphor slide, stop when leaving
  const m = document.getElementById('bgMusic');
  const mb = document.getElementById('musicBtn');
  if (cur === 3) {
    if (m.paused) { m.play().catch(() => {}); mb.classList.add('playing'); }
  } else {
    if (!m.paused) { m.pause(); mb.classList.remove('playing'); }
  }
}

function next() { goTo(cur + 1); }
function prev() { goTo(cur - 1); }

// Counter init
document.getElementById('counter').textContent = '1 / ' + total;

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  if (e.key === 'Home') { e.preventDefault(); goTo(0); }
  if (e.key === 'End') { e.preventDefault(); goTo(total - 1); }
});

// Arrow buttons + click zones
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('clickLeft').addEventListener('click', prev);
document.getElementById('clickRight').addEventListener('click', next);

// Touch swipe
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
});

// Music toggle
const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) { bgMusic.play().catch(() => {}); musicBtn.classList.add('playing'); }
  else { bgMusic.pause(); musicBtn.classList.remove('playing'); }
});
</script>
</body>
</html>
