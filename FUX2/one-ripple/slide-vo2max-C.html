<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VO2max — Two Curves</title>
<style>
  @font-face { font-family: 'Heart Rate'; src: url('HeartRate.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .scale-wrapper { width: 1920px; height: 1080px; transform: scale(var(--s)); transform-origin: center center; }
  .slide {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 30% 40%, #0d2a3a 0%, #0f2028 20%, #1a1510 45%, #2a1810 70%, #301a0a 100%);
  }

  /* Ink wash layers — matching cover slide palette */
  .ink { position: absolute; inset: 0; pointer-events: none; }
  .ink-1 {
    background:
      radial-gradient(ellipse at 22% 35%, rgba(13,42,58,0.55) 0%, transparent 50%),
      radial-gradient(ellipse at 78% 65%, rgba(42,24,16,0.5) 0%, transparent 45%);
    animation: inkDrift1 20s ease-in-out infinite alternate;
  }
  .ink-2 {
    background:
      radial-gradient(ellipse at 50% 50%, rgba(196,166,122,0.04) 0%, transparent 40%),
      radial-gradient(ellipse at 10% 75%, rgba(78,205,196,0.03) 0%, transparent 30%),
      radial-gradient(ellipse at 90% 15%, rgba(220,140,80,0.04) 0%, transparent 35%);
    animation: inkDrift2 25s ease-in-out infinite alternate;
  }
  .ink-3 {
    background:
      radial-gradient(ellipse at 35% 55%, rgba(196,166,122,0.025) 0%, transparent 35%),
      radial-gradient(ellipse at 65% 35%, rgba(13,42,58,0.3) 0%, transparent 40%);
    animation: inkDrift3 18s ease-in-out infinite alternate;
  }
  @keyframes inkDrift1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(15px, -10px) scale(1.03); }
  }
  @keyframes inkDrift2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-12px, 8px); }
  }
  @keyframes inkDrift3 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(8px, 12px) scale(1.02); }
  }

  /* Paper grain */
  .grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  /* Decorative ripple rings — drifting & expanding */
  .deco {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
  }
  .d1 {
    width: 480px; height: 480px; top: -120px; right: -80px;
    border: 1px solid rgba(78,205,196,0.05);
    animation: drift1 12s ease-in-out infinite alternate;
  }
  .d2 {
    width: 320px; height: 320px; top: -30px; right: 20px;
    border: 1.2px solid rgba(78,205,196,0.07);
    animation: drift2 9s ease-in-out infinite alternate;
  }
  .d3 {
    width: 280px; height: 280px; bottom: -60px; left: 80px;
    border: 1px solid rgba(196,166,122,0.06);
    animation: drift3 14s ease-in-out infinite alternate;
  }
  .d4 {
    width: 180px; height: 180px; bottom: 30px; left: 150px;
    border: 1.2px solid rgba(196,166,122,0.08);
    animation: drift4 8s ease-in-out infinite alternate;
  }
  .d5 {
    width: 600px; height: 600px; top: 250px; left: -200px;
    border: 1px solid rgba(78,205,196,0.03);
    animation: drift5 18s ease-in-out infinite alternate;
  }
  .d6 {
    width: 140px; height: 140px; top: 400px; right: 60px;
    border: 1px solid rgba(196,166,122,0.07);
    animation: drift6 7s ease-in-out infinite alternate;
  }
  /* Each ring has its own drift path — translate + scale + opacity */
  @keyframes drift1 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
    50% { transform: translate(-30px, 20px) scale(1.15); opacity: 1; }
    100% { transform: translate(15px, -15px) scale(0.9); opacity: 0.4; }
  }
  @keyframes drift2 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
    50% { transform: translate(25px, 30px) scale(1.2); opacity: 0.5; }
    100% { transform: translate(-20px, 10px) scale(0.85); opacity: 1; }
  }
  @keyframes drift3 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
    50% { transform: translate(40px, -20px) scale(1.25); opacity: 1; }
    100% { transform: translate(-15px, -35px) scale(0.92); opacity: 0.3; }
  }
  @keyframes drift4 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
    50% { transform: translate(-20px, -25px) scale(1.35); opacity: 1; }
    100% { transform: translate(30px, 15px) scale(0.8); opacity: 0.4; }
  }
  @keyframes drift5 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    50% { transform: translate(50px, 30px) scale(1.12); opacity: 0.8; }
    100% { transform: translate(-25px, -20px) scale(0.95); opacity: 0.3; }
  }
  @keyframes drift6 {
    0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
    50% { transform: translate(-35px, 20px) scale(1.4); opacity: 1; }
    100% { transform: translate(20px, -30px) scale(0.75); opacity: 0.3; }
  }

  /* Header text */
  .section-label {
    position: absolute; top: 42px; left: 100px;
    font-family: 'Helvetica Neue', sans-serif; font-size: 11px;
    letter-spacing: 4px; text-transform: uppercase;
    color: rgba(196,166,122,0.35); z-index: 20;
  }
  .title {
    position: absolute; top: 68px; left: 100px;
    font-family: 'Heart Rate', 'Georgia', serif; font-size: 60px;
    color: rgba(196,166,122,0.65); letter-spacing: 3px; z-index: 20;
    text-shadow: 0 0 40px rgba(196,166,122,0.08);
  }
  .legend {
    position: absolute; top: 52px; right: 100px;
    display: flex; gap: 30px; z-index: 20;
  }
  .legend-item { display: flex; align-items: center; gap: 10px; font-family: 'Georgia', serif; font-size: 14px; font-style: italic; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .l-a { color: rgba(78,205,196,0.55); }
  .l-a .legend-dot { background: rgba(78,205,196,0.55); box-shadow: 0 0 14px rgba(78,205,196,0.25); animation: dotPulseT 3s ease-in-out infinite; }
  .l-s { color: rgba(196,166,122,0.45); }
  .l-s .legend-dot { background: rgba(196,166,122,0.45); box-shadow: 0 0 14px rgba(196,166,122,0.18); animation: dotPulseO 4s ease-in-out infinite; }
  @keyframes dotPulseT {
    0%, 100% { box-shadow: 0 0 14px rgba(78,205,196,0.25); transform: scale(1); }
    50% { box-shadow: 0 0 22px rgba(78,205,196,0.4); transform: scale(1.2); }
  }
  @keyframes dotPulseO {
    0%, 100% { box-shadow: 0 0 14px rgba(196,166,122,0.18); transform: scale(1); }
    50% { box-shadow: 0 0 20px rgba(196,166,122,0.3); transform: scale(1.15); }
  }

  /* SVG Chart */
  .chart-svg {
    position: absolute; top: 130px; left: 60px;
    width: 1800px; height: 760px; z-index: 10;
  }

  /* Drawing animation */
  .draw {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw var(--dur) ease-out var(--delay) forwards;
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* Fade-in for markers and annotations */
  .fade {
    opacity: 0;
    animation: fadeIn 0.8s ease var(--delay) forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Ripple pulse on markers */
  @keyframes pulse {
    0%, 100% { r: var(--r0); opacity: var(--op0); }
    50% { r: var(--r1); opacity: var(--op1); }
  }

  /* Annotations */
  .anno {
    position: absolute; z-index: 15;
    font-family: 'Georgia', serif; font-style: italic;
    color: rgba(255,255,255,0.4);
    opacity: 0; animation: fadeIn 0.8s ease var(--delay) forwards;
  }
  .anno .vo2 {
    display: block; font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px; font-style: normal; letter-spacing: 1px;
    opacity: 0.5; margin-bottom: 2px;
  }

  /* Bottom text */
  .bottom-line {
    position: absolute; bottom: 38px; left: 0; right: 0;
    text-align: center; z-index: 20;
    opacity: 0; animation: fadeIn 1s ease 6.5s forwards;
  }
  .bottom-line p {
    font-family: 'Georgia', serif; font-size: 20px;
    color: rgba(196,166,122,0.45); font-style: italic;
  }
  .bottom-line .num {
    font-family: 'Heart Rate', serif; font-size: 34px; font-style: normal;
    color: rgba(78,205,196,0.45); letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(78,205,196,0.08);
  }
</style>
</head>
<body>
<div class="scale-wrapper">
<div class="slide">

  <div class="ink ink-1"></div>
  <div class="ink ink-2"></div>
  <div class="ink ink-3"></div>
  <div class="grain"></div>
  <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div><div class="deco d4"></div><div class="deco d5"></div><div class="deco d6"></div>

  <div class="section-label">The Two Curves</div>
  <div class="title">Two lives, one choice</div>
  <div class="legend">
    <div class="legend-item l-a"><div class="legend-dot"></div>active &mdash; the gradual slope</div>
    <div class="legend-item l-s"><div class="legend-dot"></div>sedentary &mdash; the cliff</div>
  </div>

  <svg class="chart-svg" viewBox="0 0 1800 760" fill="none">
    <defs>
      <!-- Ink wash displacement filter -->
      <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- Soft glow for curves -->
      <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <!-- Radial glows for ripple markers -->
      <radialGradient id="glowT"><stop offset="0%" stop-color="rgba(78,205,196,0.2)"/><stop offset="100%" stop-color="rgba(78,205,196,0)"/></radialGradient>
      <radialGradient id="glowO"><stop offset="0%" stop-color="rgba(196,166,122,0.15)"/><stop offset="100%" stop-color="rgba(196,166,122,0)"/></radialGradient>
    </defs>

    <!-- Age markers -->
    <g class="fade" style="--delay:0.3s">
      <text x="80" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">20</text>
      <text x="353" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">30</text>
      <text x="627" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">40</text>
      <text x="900" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">50</text>
      <text x="1173" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">60</text>
      <text x="1447" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">70</text>
      <text x="1720" y="748" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="rgba(255,255,255,0.12)">80</text>
    </g>

    <!-- ACTIVE CURVE — outer glow stroke (wide, soft, breathing) -->
    <path id="activeGlow"
      d="M 80,116 C 145,113 220,132 353,176 C 435,200 545,222 627,240 C 712,258 815,280 900,300 C 978,318 1088,340 1173,360 C 1255,378 1362,398 1447,420 C 1538,440 1642,455 1720,466"
      stroke="rgba(78,205,196,0.15)" stroke-width="12" stroke-linecap="round"
      filter="url(#glow)" class="draw" style="--dur:3.5s; --delay:0.8s">
      <animate attributeName="stroke-opacity" values="0.15;0.25;0.15" dur="5s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="12;18;12" dur="5s" begin="4s" repeatCount="indefinite"/>
    </path>

    <!-- ACTIVE CURVE — main hand-drawn stroke (with ink displacement) -->
    <path id="activeMain"
      d="M 80,116 C 148,110 215,136 353,178 C 438,202 542,224 627,242 C 715,260 812,283 900,302 C 980,320 1085,343 1173,362 C 1258,380 1365,400 1447,422 C 1535,442 1645,457 1720,468"
      stroke="rgba(78,205,196,0.65)" stroke-width="3" stroke-linecap="round"
      filter="url(#ink)" class="draw" style="--dur:3.2s; --delay:0.9s"/>

    <!-- ACTIVE CURVE — thin bright core (slightly offset for brush texture) -->
    <path id="activeCore"
      d="M 82,118 C 150,112 218,138 355,180 C 440,204 544,226 629,244 C 718,262 814,285 902,304 C 982,322 1087,345 1175,364 C 1260,382 1367,402 1449,424 C 1537,444 1647,459 1720,470"
      stroke="rgba(78,205,196,0.4)" stroke-width="1.5" stroke-linecap="round"
      class="draw" style="--dur:3s; --delay:1s"/>

    <!-- SEDENTARY CURVE — outer glow -->
    <path id="sedGlow"
      d="M 80,116 C 150,130 230,170 353,222 C 440,258 548,298 627,332 C 718,370 820,400 900,430 C 972,456 1080,486 1173,510 C 1260,530 1365,552 1447,572 C 1540,588 1645,600 1720,612"
      stroke="rgba(196,166,122,0.12)" stroke-width="12" stroke-linecap="round"
      filter="url(#glow)" class="draw" style="--dur:3.5s; --delay:2s"/>

    <!-- SEDENTARY CURVE — main stroke -->
    <path id="sedMain"
      d="M 80,116 C 148,128 228,168 353,220 C 438,256 546,296 627,330 C 716,368 818,398 900,428 C 970,454 1078,484 1173,508 C 1258,528 1363,550 1447,570 C 1538,586 1643,598 1720,610"
      stroke="rgba(196,166,122,0.55)" stroke-width="3" stroke-linecap="round"
      filter="url(#ink)" class="draw" style="--dur:3.2s; --delay:2.1s"/>

    <!-- SEDENTARY CURVE — thin core -->
    <path id="sedCore"
      d="M 82,118 C 150,130 232,170 355,222 C 442,258 550,298 629,332 C 720,370 822,400 902,430 C 974,456 1082,486 1175,510 C 1262,530 1367,552 1449,572 C 1542,588 1647,600 1720,614"
      stroke="rgba(196,166,122,0.35)" stroke-width="1.5" stroke-linecap="round"
      class="draw" style="--dur:3s; --delay:2.2s"/>

    <!-- THRESHOLD LINE — hand-drawn dashed -->
    <path
      d="M 80,524 C 300,526 500,522 700,525 C 900,523 1100,527 1300,524 C 1500,526 1650,523 1720,525"
      stroke="rgba(196,166,122,0.15)" stroke-width="1" stroke-linecap="round"
      stroke-dasharray="14 18" filter="url(#ink)"
      class="fade" style="--delay:4s"/>
    <text x="1710" y="516" text-anchor="end"
      font-family="Georgia,serif" font-size="11" font-style="italic"
      fill="rgba(196,166,122,0.22)"
      class="fade" style="--delay:4s">independence line &mdash; 18 ml/kg/min</text>

    <!-- ACTIVE RIPPLE MARKERS — pulsing -->
    <!-- Age 30 / VO2max 41 — strong vitality -->
    <g class="fade" style="--delay:4.2s">
      <circle cx="353" cy="178" r="38" fill="url(#glowT)">
        <animate attributeName="r" values="38;46;38" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="353" cy="178" r="24" stroke="rgba(78,205,196,0.15)" stroke-width="0.8" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="24;30;24" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="353" cy="178" r="14" stroke="rgba(78,205,196,0.3)" stroke-width="1" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="14;18;14" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="353" cy="178" r="4.5" fill="rgba(78,205,196,0.6)">
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Age 50 / VO2max 33 — moderate -->
    <g class="fade" style="--delay:4.7s">
      <circle cx="900" cy="302" r="30" fill="url(#glowT)">
        <animate attributeName="r" values="30;36;30" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="302" r="18" stroke="rgba(78,205,196,0.15)" stroke-width="0.8" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="18;22;18" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="302" r="10" stroke="rgba(78,205,196,0.28)" stroke-width="1" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="10;13;10" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="302" r="3.5" fill="rgba(78,205,196,0.5)">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Age 70 / VO2max 25 — fading -->
    <g class="fade" style="--delay:5.2s">
      <circle cx="1447" cy="422" r="20" fill="url(#glowT)">
        <animate attributeName="r" values="20;24;20" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1447" cy="422" r="11" stroke="rgba(78,205,196,0.12)" stroke-width="0.8" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="11;14;11" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1447" cy="422" r="3" fill="rgba(78,205,196,0.4)">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- SEDENTARY RIPPLE MARKERS — slower, dimmer pulse -->
    <!-- Age 50 / VO2max 26 -->
    <g class="fade" style="--delay:5s">
      <circle cx="900" cy="430" r="20" fill="url(#glowO)">
        <animate attributeName="r" values="20;24;20" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="430" r="12" stroke="rgba(196,166,122,0.15)" stroke-width="0.8" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="12;15;12" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="430" r="3" fill="rgba(196,166,122,0.4)">
        <animate attributeName="opacity" values="0.4;0.6;0.4" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Age 65 / VO2max 17 — nearly gone -->
    <g class="fade" style="--delay:5.4s">
      <circle cx="1310" cy="540" r="16" fill="url(#glowO)">
        <animate attributeName="r" values="16;19;16" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1310" cy="540" r="9" stroke="rgba(196,166,122,0.12)" stroke-width="0.8" fill="none" filter="url(#ink)">
        <animate attributeName="r" values="9;11;9" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1310" cy="540" r="2.5" fill="rgba(196,166,122,0.3)">
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- "the cliff" label -->
    <text x="730" y="420" transform="rotate(-25,730,420)"
      font-family="'Heart Rate',serif" font-size="30" letter-spacing="3"
      fill="rgba(196,166,122,0.3)"
      class="fade" style="--delay:5.8s">the cliff</text>

    <!-- Gap annotation at age 60 -->
    <line x1="1173" y1="368" x2="1173" y2="504" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 6" class="fade" style="--delay:5.6s"/>
    <text x="1186" y="440" font-family="'Helvetica Neue',sans-serif" font-size="11" letter-spacing="1.5" fill="rgba(255,255,255,0.15)" class="fade" style="--delay:5.6s">20-YEAR GAP</text>
  </svg>

  <!-- Text annotations (HTML for organic positioning) -->
  <div class="anno" style="top:250px; left:240px; transform:rotate(-2deg); font-size:15px; color:rgba(78,205,196,0.5); --delay:4.3s">
    <span class="vo2">VO&#8322;MAX 41</span>run a 5K with friends
  </div>
  <div class="anno" style="top:400px; left:780px; transform:rotate(-1deg); font-size:14px; color:rgba(78,205,196,0.45); --delay:4.8s">
    <span class="vo2">VO&#8322;MAX 33</span>hike, carry groceries upstairs
  </div>
  <div class="anno" style="top:540px; left:1340px; transform:rotate(1deg); font-size:13px; color:rgba(78,205,196,0.38); --delay:5.3s">
    slower, but still free
  </div>
  <div class="anno" style="top:550px; left:780px; transform:rotate(2deg); font-size:13px; color:rgba(196,166,122,0.3); --delay:5.1s">
    stairs become a battle
  </div>
  <div class="anno" style="top:670px; left:1200px; transform:rotate(-1deg); font-size:12px; color:rgba(196,166,122,0.25); --delay:5.5s">
    needs help every day
  </div>

  <div class="bottom-line">
    <p><span class="num">50&ndash;70%</span> of the decline is not aging. It is stillness.</p>
  </div>

</div>
</div>

<script>
// Scale to fit viewport
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.querySelector('.scale-wrapper').style.setProperty('--s', s);
}
window.addEventListener('resize', fit);
window.addEventListener('DOMContentLoaded', () => {
  fit();
  // Calculate and set path lengths for stroke-dasharray animation
  document.querySelectorAll('.draw').forEach(path => {
    const len = path.getTotalLength();
    path.style.setProperty('--len', len);
  });
});
</script>
</body>
</html>
