<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 09 — Closing</title>
<style>
  @font-face { font-family: 'Heart Rate'; src: url('HeartRate.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .scale-wrapper { width: 1920px; height: 1080px; transform: scale(var(--s)); transform-origin: center center; }
  .slide { width: 1920px; height: 1080px; background: radial-gradient(ellipse at 50% 50%, #0d2a3a 0%, #12202a 25%, #1a1510 50%, #2a1810 80%); position: relative; overflow: hidden; }
  /* Ripple — centered, large, many rings */
  .ripple { position: absolute; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .ripple:nth-child(1) { width: 80px; height: 80px; border: 2.5px solid rgba(196,166,122,0.50); box-shadow: 0 0 30px rgba(196,166,122,0.1); }
  .ripple:nth-child(2) { width: 200px; height: 200px; border: 2px solid rgba(196,166,122,0.35); }
  .ripple:nth-child(3) { width: 360px; height: 360px; border: 1.5px solid rgba(196,166,122,0.25); }
  .ripple:nth-child(4) { width: 560px; height: 560px; border: 1.5px solid rgba(196,166,122,0.16); }
  .ripple:nth-child(5) { width: 800px; height: 800px; border: 1px solid rgba(196,166,122,0.10); }
  .ripple:nth-child(6) { width: 1100px; height: 1100px; border: 1px solid rgba(196,166,122,0.06); }
  .ripple:nth-child(7) { width: 1460px; height: 1460px; border: 1px solid rgba(196,166,122,0.03); }
  .glow { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(196,166,122,0.15) 0%, transparent 60%); top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .content { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 10; text-align: center; width: 1200px; }
  .main-text { font-family: 'Georgia', serif; font-size: 72px; color: #c4a67a; line-height: 1.3; margin-bottom: 32px; text-shadow: 0 0 40px rgba(196,166,122,0.15); }
  .sub-text { font-family: 'Georgia', serif; font-size: 24px; color: rgba(255,255,255,0.5); font-style: italic; line-height: 1.6; }
  .author { position: absolute; bottom: 50px; right: 80px; font-family: 'Helvetica Neue', sans-serif; font-size: 16px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 10; }
  .course { position: absolute; bottom: 50px; left: 80px; font-family: 'Helvetica Neue', sans-serif; font-size: 13px; color: rgba(255,255,255,0.15); letter-spacing: 2px; z-index: 10; }
</style>
<script>
  function fit() { const s = Math.min(window.innerWidth/1920, window.innerHeight/1080); document.querySelector('.scale-wrapper').style.setProperty('--s', s); }
  window.addEventListener('resize', fit); window.addEventListener('DOMContentLoaded', fit);
</script>
</head>
<body>
<div class="scale-wrapper"><div class="slide">
  <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="main-text">Aging is inevitable.<br>The cliff is not.</div>
    <div class="sub-text">One ripple is all it takes to begin.</div>
  </div>
  <div class="course">SVA IxD &middot; Framing User Experiences &middot; Spring 2026</div>
  <div class="author">Gordon Cheng</div>
</div></div>
</body></html>
