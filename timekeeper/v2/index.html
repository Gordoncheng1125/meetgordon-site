<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1:1 Timekeeper · 11/24</title>
<style>
:root{--bg:#f3f0e8;--ink:#161b26;--soft:#646c7a;--line:#cfc8b8;--card:#fbf9f3;--warn:#f2c200;--over:#c8402c;--ok:#2f6b4f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue","PingFang SC",sans-serif;transition:background-color .25s ease-out}
body.warn{background:#ffe98a}
body.over{background:#f6c9bf}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
main{padding:28px 32px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;color:var(--soft);font-size:15px;letter-spacing:.04em}
.clock{font-size:22px;color:var(--ink);font-weight:500}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.label{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.name{font-size:clamp(56px,11vw,150px);font-weight:700;line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.slot{font-size:20px;color:var(--soft);font-variant-numeric:tabular-nums}
.count{font-size:clamp(84px,19vw,260px);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:18px}
.cue{font-size:clamp(20px,2.6vw,34px);font-weight:600;min-height:1.4em;margin-top:10px}
body.warn .cue{color:#5a4300} body.over .cue{color:var(--over)}
.next{border-top:2px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.next b{font-size:clamp(26px,3.6vw,46px)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;font-size:15px;padding:9px 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:4px}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid #1f6fd0;outline-offset:2px}
button.on{background:var(--ink);color:var(--bg)}
.shift{align-self:center;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
aside{border-left:1px solid var(--line);background:var(--card);padding:22px 18px;overflow:auto}
aside h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 10px;font-weight:500}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;padding:7px 8px;font-size:17px;font-variant-numeric:tabular-nums;border-left:4px solid transparent}
li .t{color:var(--soft);width:48px}
li.done{opacity:.35;text-decoration:line-through}
li.now{background:var(--ink);color:var(--bg);font-weight:700;border-left-color:var(--warn)}
li.now .t{color:#c9cedb}
li.up{border-left-color:var(--warn)}
.bk{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.bk .big{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.bk .ctrl{margin-top:0}
.bk button{font-size:13px;padding:6px 10px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<main>
  <div class="top"><span>1:1 WITH NGA · 15 MIN EACH · WHITEBOARD AREA</span><span class="clock" id="clock">--:--:--</span></div>
  <div class="stage">
    <div class="label" id="lab">Now</div>
    <div class="name" id="name">—</div>
    <div class="slot" id="slot"></div>
    <div class="count" id="count">--:--</div>
    <div class="cue" id="cue"></div>
  </div>
  <div class="next"><span><span class="label">Next</span><br><b id="next">—</b></span><span class="slot" id="nextat"></span></div>
  <div class="ctrl">
    <button id="late">Running late +1 min</button>
    <button id="early">−1 min</button>
    <button id="skip">Start next now</button>
    <button id="reset">Back to schedule</button>
    <button id="snd">Sound off</button>
    <span class="shift" id="shift"></span>
  </div>
</main>
<aside>
  <h2>Order</h2>
  <ol id="list"></ol>
  <div class="bk">
    <h2>Breakout timer</h2>
    <div class="big" id="bk">00:00</div>
    <div class="ctrl">
      <button data-m="5">5</button><button data-m="10">10</button><button data-m="15">15</button><button data-m="30">30</button><button data-m="60">60</button><button data-m="0">Stop</button>
    </div>
  </div>
</aside>
</div>
<script>
// 11/24 schedule: first slot 1:15 pm, 15 minutes each, class regroups 4:30 pm
var NAMES=['JuJu','Kathy','Kevin','Gordon','Phil','Ramón','Yuxuan','Feifey','Shuyang','Mingyue','Seren','Sophie','Darren'];
var LEN=15*60, WARN=60;
var d=new Date(); var BASE=new Date(d.getFullYear(),d.getMonth(),d.getDate(),13,15,0).getTime()/1000;
var shift=0, sound=false, lastCue='', bkEnd=0;
try{var s=JSON.parse(localStorage.getItem('tk1124')||'{}'); if(s.day===d.toDateString()){shift=s.shift||0}}catch(e){}
function save(){try{localStorage.setItem('tk1124',JSON.stringify({day:d.toDateString(),shift:shift}))}catch(e){}}
function $(id){return document.getElementById(id)}
function hm(t){var x=new Date(t*1000);var h=x.getHours(),m=x.getMinutes();return ((h+11)%12+1)+':'+(m<10?'0':'')+m}
function mmss(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function beep(n){if(!sound)return;try{var a=new (window.AudioContext||window.webkitAudioContext)();for(var i=0;i<n;i++){var o=a.createOscillator(),g=a.createGain();o.frequency.value=n>1?880:660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.18,a.currentTime+i*.28);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.28+.22);o.start(a.currentTime+i*.28);o.stop(a.currentTime+i*.28+.24)}}catch(e){}}
var list=$('list');
NAMES.forEach(function(n,i){var li=document.createElement('li');li.innerHTML='<span class="t"></span><span>'+(i+1)+'. '+n+'</span>';list.appendChild(li)});
function tick(){
  var now=Date.now()/1000, start=BASE+shift, end=start+NAMES.length*LEN;
  $('clock').textContent=new Date().toLocaleTimeString('en-US');
  var i=Math.floor((now-start)/LEN), cls='', cue='';
  [].forEach.call(list.children,function(li,k){li.firstChild.textContent=hm(start+k*LEN);li.className=k<i?'done':(k===i?'now':(k===i+1?'up':''))});
  if(now<start){
    $('lab').textContent='Starts in'; $('name').textContent=NAMES[0]; $('slot').textContent='First 1:1 at '+hm(start);
    $('count').textContent=mmss(start-now); $('next').textContent=NAMES[1]; $('nextat').textContent=hm(start+LEN);
    if(start-now<=WARN){cls='warn';cue=NAMES[0]+', please come to the whiteboard'}
  }else if(now>=end){
    $('lab').textContent='Done'; $('name').textContent='All 13 done'; $('slot').textContent='Regroup as a class at 4:30';
    $('count').textContent='00:00'; $('next').textContent='—'; $('nextat').textContent='';
  }else{
    var left=start+(i+1)*LEN-now, nx=NAMES[i+1];
    $('lab').textContent='Now · '+(i+1)+' of '+NAMES.length; $('name').textContent=NAMES[i];
    $('slot').textContent=hm(start+i*LEN)+' – '+hm(start+(i+1)*LEN);
    $('count').textContent=mmss(left);
    $('next').textContent=nx||'Last one'; $('nextat').textContent=nx?('at '+hm(start+(i+1)*LEN)):'';
    if(left<=10){cls='over';cue='Time. '+(nx?nx+' is up.':'Wrap up.')}
    else if(left<=WARN){cls='warn';cue=nx?(nx+', please wait by the whiteboard'):'One minute left'}
  }
  document.body.className=cls; $('cue').textContent=cue;
  if(cue&&cue!==lastCue){beep(cls==='over'?2:1)} lastCue=cue;
  $('shift').textContent=shift?('Schedule shifted '+(shift>0?'+':'')+Math.round(shift/60)+' min'):'On schedule';
  var b=bkEnd?bkEnd-now:0; if(bkEnd&&b<=0){bkEnd=0;beep(2)} $('bk').textContent=mmss(b);
}
$('late').onclick=function(){shift+=60;save();tick()};
$('early').onclick=function(){shift-=60;save();tick()};
$('reset').onclick=function(){shift=0;save();tick()};
$('skip').onclick=function(){var now=Date.now()/1000,start=BASE+shift;var i=Math.floor((now-start)/LEN);if(now<start){shift=Math.round(now-BASE)}else{shift-=Math.round(start+(i+1)*LEN-now)}save();tick()};
$('snd').onclick=function(){sound=!sound;this.textContent=sound?'Sound on':'Sound off';this.className=sound?'on':'';if(sound)beep(1)};
[].forEach.call(document.querySelectorAll('.bk button'),function(b){b.onclick=function(){var m=+b.dataset.m;bkEnd=m?Date.now()/1000+m*60:0;tick()}});
tick(); setInterval(tick,250);
</script>
</body>
</html>
