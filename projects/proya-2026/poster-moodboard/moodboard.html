<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROYA Mother's Day — Poster Moodboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0c;
    color: #e0e0e0;
    font-family: "Noto Serif SC", "Source Han Serif CN", Georgia, serif;
    padding: 40px;
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #8b9dc3;
    font-weight: 300;
    margin-bottom: 8px;
  }
  .header h2 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 3px;
    color: #d4c5b0;
  }
  .header .sub {
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 160px;
    gap: 6px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.92) contrast(1.05);
    transition: filter 0.3s;
  }
  .grid img:hover {
    filter: brightness(1) contrast(1);
  }
  /* Layout: varied spans for visual interest */
  .grid .a { grid-column: span 2; grid-row: span 2; }
  .grid .b { grid-column: span 1; grid-row: span 2; }
  .grid .c { grid-column: span 1; grid-row: span 1; }
  .grid .d { grid-column: span 2; grid-row: span 1; }
  .grid .e { grid-column: span 1; grid-row: span 3; }
  .grid .f { grid-column: span 2; grid-row: span 2; }
  .grid .g { grid-column: span 1; grid-row: span 1; }
  .grid .h { grid-column: span 1; grid-row: span 2; }
  .grid .wide { grid-column: span 2; grid-row: span 1; }

  .keywords {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-top: 36px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }
  .keywords .kw {
    text-align: center;
  }
  .keywords .kw .cn {
    font-size: 20px;
    letter-spacing: 4px;
    color: #d4c5b0;
    font-weight: 300;
  }
  .keywords .kw .en {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
    margin-top: 4px;
  }
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 10px;
    color: #444;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>PROYA 2026 Mother's Day</h1>
  <h2>电商海报 Moodboard</h2>
  <div class="sub">Visual Direction Reference</div>
</div>

<div class="grid">
  <!-- Row 1: film poster large + hand triptych tall + hands light -->
  <div class="a"><img src="01-film-poster.png" alt="film poster shoulder"></div>
  <div class="e"><img src="02-triptych-hands-face.png" alt="triptych hands face"></div>
  <div class="b"><img src="11-double-exposure-flowers.jpg" alt="double exposure flowers"></div>
  <div class="c"><img src="06-hands-intertwined.jpg" alt="hands intertwined"></div>

  <!-- Row 2 -->
  <div class="c"><img src="07-hands-dappled-light.jpg" alt="hands dappled light"></div>
  <div class="f"><img src="03-hands-light.png" alt="hands touching light"></div>
  <div class="c"><img src="10-hand-dried-flowers.jpg" alt="hand dried flowers"></div>
  <div class="c"><img src="13-face-light-shadow.jpg" alt="face light shadow"></div>

  <!-- Row 3 -->
  <div class="d"><img src="04-hand-water-flower.png" alt="hand water flower"></div>
  <div class="b"><img src="05-window-sakura.png" alt="window sakura"></div>
  <div class="b"><img src="08-hand-sheer-fabric.jpg" alt="hand sheer fabric"></div>

  <!-- Row 4 -->
  <div class="c"><img src="09-hand-curtain.jpg" alt="hand curtain"></div>
  <div class="c"><img src="12-double-exposure-pink.jpg" alt="double exposure pink"></div>
  <div class="c"><img src="14-woman-window-linen.jpg" alt="woman window linen"></div>
</div>

<div class="keywords">
  <div class="kw"><div class="cn">柔 软</div><div class="en">Soft</div></div>
  <div class="kw"><div class="cn">透 亮</div><div class="en">Translucent</div></div>
  <div class="kw"><div class="cn">坚 韧</div><div class="en">Resilient</div></div>
  <div class="kw"><div class="cn">自 己</div><div class="en">Be Yourself</div></div>
</div>

<div class="footer">PROYA 珀萊雅 — 各自盛放</div>

</body>
</html>
